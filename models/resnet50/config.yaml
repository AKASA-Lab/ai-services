model:
  name: resnet50
  timm_name: resnet50
  pretrained: true
  pretrained_tag: a1_in1k              # ImageNet-1k weights (timm "resnet50.a1_in1k")
  num_classes: 4
  drop_rate: 0.0                       # ResNet50 has no built-in classifier dropout

data:
  image_root: data/raw
  splits_dir: data/splits
  safe_crop: 960                       # removes DALL-E colour bar (docs/dataset_audit.md)
  cache_size: 256                      # cropped image is resized to this once, then augmented
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:                           # training images only
  random_resized_crop_scale: [0.75, 1.0]
  random_resized_crop_ratio: [0.9, 1.1]
  horizontal_flip: true
  rotation_degrees: 10                  # filled with each image's own border colour
  colour_jitter: false                  # leaf colour is the signal; left untouched

training:
  batch_size: 16
  max_epochs: 15
  frozen_backbone_epochs: 3             # head only first, then full fine-tuning
  optimizer: AdamW
  backbone_lr: 1.0e-4
  classifier_lr: 1.0e-3
  weight_decay: 1.0e-4
  loss: weighted_cross_entropy          # class weights from the train partition of each run
  selection_metric: val_macro_f1        # ties broken by lower validation loss

efficiency:
  latency_warmup: 10
  latency_iterations: 50
